  <!-- Privacy -->
  <section id="view-privacy" class="view" hidden aria-labelledby="privacy-h">
    <a class="back-home" href="#help"><span aria-hidden="true">‹</span> <span data-i18n="nav_help">Help</span></a>
    <h1 id="privacy-h" tabindex="-1" data-i18n="privacy_h">Your privacy</h1>
    <h2 data-i18n="privacy_now_h">How this prototype handles your papers</h2>
    <ul class="plain-list" id="privNow"></ul>
    <div class="field" style="max-width:30rem">
      <label for="extraNames" data-i18n="names_label">Extra names to hide</label>
      <input type="text" id="extraNames" autocomplete="off">
      <span class="small" data-i18n="names_hint"></span>
    </div>
    <h2 data-i18n="privacy_launch_h">What a real launch would need</h2>
    <ul class="plain-list" id="privLaunch"></ul>
    <div class="danger-zone">
      <p data-i18n="clear_warn"></p>
      <div class="row"><button class="btn danger" id="clearAll" type="button" data-i18n="clear_all">Clear everything</button></div>
      <div id="clearConfirm" class="row" hidden role="alertdialog" aria-labelledby="clearSure">
        <strong id="clearSure" data-i18n="clear_sure"></strong>
        <button class="btn danger-solid" id="clearYes" type="button" data-i18n="clear_yes">Yes, clear everything</button>
        <button class="btn" id="clearNo" type="button" data-i18n="clear_no">Cancel</button>
      </div>
    </div>
    <p class="small" data-i18n="hide_note"></p>
  </section>
